<div class="container mt-lg-5">

  <div class="card" *ngIf="products">

    <div class="card-header bg-primary text-white text-center fw-bold" >
      Liste des produits
    </div>

    <div class="card-body">
      <table class="table table-bordered table-striped" >
        <thead>

        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Quantity</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let p of products">
          <td>{{p.id}}</td>
          <td>{{p.name}}</td>
          <td>{{p.price}}</td>
          <td>{{p.quantity}}</td>
        </tr>

        </tbody>
      </table>

    </div>
  </div>

</div>
