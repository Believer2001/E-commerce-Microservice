<div class="container mt-lg-5">

  <div class="card" *ngIf="customer">
    <div class="card-header bg-primary text-white text-center fw-bold "  >Customers list</div>
    <div class="card-body">
      <table class="table table-bordered table-striped" >

        <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let c of customer">
          <td>{{c.id}}</td>
          <td>{{c.name}}</td>
          <td>{{c.email}}</td>
        </tr>

        </tbody>

      </table>
    </div>

  </div>
</div>
